plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.radio.walkie'
    compileSdk 36

    // Номер сборки: WALKIE_BUILD_NUMBER задаёт «Выпустить релиз» (последний релиз + 1), иначе — номер запуска CI
    def buildNumber = (System.getenv('WALKIE_BUILD_NUMBER') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int

    defaultConfig {
        applicationId 'ru.radio.walkie'
        minSdk 26
        targetSdk 36
        versionCode 100 + buildNumber
        versionName "1.0.${buildNumber}"
        buildConfigField "String", "UPDATE_PREFIX", '"Walkie-"'  // имя APK в релизах: Walkie-1.0.N.apk
    }

    buildFeatures {
        buildConfig true
    }

    // Постоянный ключ подписи: без него Android не примет обновление поверх установленной рации.
    // Ключ — в секретах репозитория (см. README), в код он не попадает.
    def keystoreFile = System.getenv('WALKIE_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storeType 'PKCS12'
                storePassword System.getenv('WALKIE_KEYSTORE_PASSWORD')
                keyAlias 'walkie'
                keyPassword System.getenv('WALKIE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Рация — это файлы ПК-рации как есть: ../radio-walkie/web попадает в APK без изменений
    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir('generated/walkie-web')
    }
}

def copyWalkieWeb = tasks.register('copyWalkieWeb', Sync) {
    from rootProject.file('../radio-walkie/web')
    into layout.buildDirectory.dir('generated/walkie-web/web')
}
preBuild.dependsOn copyWalkieWeb

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
