plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.radio.station'
    compileSdk 36

    // Номер сборки: WALKIE_BUILD_NUMBER задаёт «Выпустить релиз» (последний релиз + 1), иначе — номер запуска CI
    def buildNumber = (System.getenv('WALKIE_BUILD_NUMBER') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int

    defaultConfig {
        applicationId 'ru.radio.station'
        minSdk 26
        targetSdk 36
        versionCode 100 + buildNumber
        versionName "1.0.${buildNumber}"
        buildConfigField "String", "UPDATE_PREFIX", '"Station-"'  // имя APK в релизах: Station-1.0.N.apk
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Подпись — тем же ключом, что у рации (секреты репозитория или android/tools/sign_v2.py после сборки)
    def keystoreFile = System.getenv('WALKIE_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storeType 'PKCS12'
                storePassword System.getenv('WALKIE_KEYSTORE_PASSWORD')
                keyAlias 'walkie'
                keyPassword System.getenv('WALKIE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile ? signingConfigs.release : null
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7' // свой сервер эфира (AirHub)
}
