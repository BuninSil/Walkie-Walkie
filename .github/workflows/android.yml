name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'radio-walkie/web/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Ключ отладочной подписи до сборки
        run: |
          ls -la ~/.android/ 2>&1 || true
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>&1 | grep -E "SHA256|Создан|Creation" || echo "NO DEBUG KEYSTORE BEFORE BUILD"

      - name: Собрать рацию для Android
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: walkie-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Ключ отладочной подписи после сборки
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>&1 | grep -E "SHA256|Creation" || true
