name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'radio-walkie/web/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Постоянный ключ подписи из секретов репозитория. Без него APK не выпускаем:
      # со случайным ключом его нельзя поставить обновлением поверх рации.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.WALKIE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WALKIE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Нет секретов WALKIE_KEYSTORE_BASE64 / WALKIE_KEYSTORE_PASSWORD — код проверим, но APK не выпустим. См. android/README.md"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/walkie.p12"
          echo "WALKIE_KEYSTORE_FILE=$RUNNER_TEMP/walkie.p12" >> "$GITHUB_ENV"
          echo "WALKIE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/walkie.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" | grep -i fingerprint

      - name: Собрать рацию для Android
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Подписанный APK
        working-directory: android
        run: |
          if [ -z "$WALKIE_KEYSTORE_FILE" ]; then
            echo "::error::APK не подписан: добавьте секреты WALKIE_KEYSTORE_BASE64 и WALKIE_KEYSTORE_PASSWORD (см. android/README.md)"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "Walkie-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: walkie-android-apk
          path: android/Walkie-*.apk
