name: Release

# Подписанный APK собирается и подписывается вне CI (ключа в репозитории нет).
# Чтобы выпустить релиз, в ветку apk-release пушится коммит с APK и notes.md:
#   Walkie-1.0.N.apk  → релиз v1.0.N «Рация 1.0.N»
#   Station-1.0.N.apk → релиз station-v1.0.N «Радиостанция 1.0.N»
# После этого ветка удаляется.

on:
  push:
    branches: [apk-release]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # нужен и коммит под APK — на него вешается тег релиза

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls *.apk | head -1)
          [ -f "$apk" ] && [ -f notes.md ] || { echo "::error::Нужны APK и notes.md"; exit 1; }
          case "$apk" in
            Walkie-*)  version=${apk#Walkie-};  tag_prefix=walkie-v;   title="Рация" ;;
            Station-*) version=${apk#Station-}; tag_prefix=station-v;  title="Радиостанция" ;;
            *) echo "::error::Неизвестный APK: $apk"; exit 1 ;;
          esac
          version=${version%.apk}
          target=$(git rev-parse HEAD~1)
          # Тег НЕ голый semver (walkie-v… / station-v…) и НЕ latest: так автообновление ПК-станции
          # «Радио» (electron-updater по дефолтному каналу берёт latest.yml из последнего semver-
          # релиза) эти Android-релизы не распознаёт и не путает со своими. Релиз остаётся обычным
          # (не pre-release), потому что обновлятор рации (Updater.java) пропускает pre-release, а
          # ищет обновление по имени файла APK — тег ему не важен.
          gh release create "${tag_prefix}${version}" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title "$title $version" \
            --notes-file notes.md \
            --latest=false

      - name: Убрать ветку apk-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --delete apk-release || true
