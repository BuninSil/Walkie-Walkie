name: Station APK

on:
  push:
    paths:
      - 'radio-air/**'
      - '.github/workflows/station.yml'
  workflow_dispatch:

# Сборки по очереди: иначе два запуска (ветка и main) одновременно пишут APK в одну ветку
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # неподписанный APK кладётся в ветку apk-unsigned-station
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Постоянный ключ подписи из секретов репозитория. Без него APK не выпускаем:
      # со случайным ключом его нельзя поставить обновлением поверх рации.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.WALKIE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WALKIE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Нет секретов WALKIE_KEYSTORE_BASE64 / WALKIE_KEYSTORE_PASSWORD — APK будет неподписанным (ветка apk-unsigned-station). См. android/README.md"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/walkie.p12"
          echo "WALKIE_KEYSTORE_FILE=$RUNNER_TEMP/walkie.p12" >> "$GITHUB_ENV"
          echo "WALKIE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/walkie.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" | grep -i fingerprint

      - name: Собрать радиостанцию для Android
        working-directory: radio-air
        run: ./gradlew assembleRelease --no-daemon

      - name: Подписанный APK
        if: env.WALKIE_KEYSTORE_FILE != ''
        working-directory: radio-air
        run: cp app/build/outputs/apk/release/app-release.apk "Station-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        if: env.WALKIE_KEYSTORE_FILE != ''
        with:
          name: station-android-apk
          path: radio-air/Station-*.apk

      # Без ключа в секретах: неподписанный APK — в ветку apk-unsigned-station, подписывают его вне CI
      # тем же ключом (android/tools/sign_v2.py). Ставить неподписанный APK нельзя.
      - name: Неподписанный APK в ветку apk-unsigned-station
        if: env.WALKIE_KEYSTORE_FILE == ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          cp "$GITHUB_WORKSPACE/radio-air/app/build/outputs/apk/release/app-release-unsigned.apk" "Station-1.0.${GITHUB_RUN_NUMBER}-unsigned.apk"
          git init -q -b apk-unsigned-station
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Неподписанный APK 1.0.${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/apk-unsigned-station
