name: PC apps (Радио + Рация)

# Собирает установщики «Радио» (станция + рация) и «Рация» (отдельный виджет) для Windows
# из radio-air-PC. По тегу vX.Y.Z — публикует их в релиз GitHub (electron-builder --publish always),
# откуда потом обновляется electron-updater: «Радио» по latest.yml, «Рация» по walkie.yml.
# Запуск вручную (workflow_dispatch) — только собирает и кладёт .exe в артефакты, без публикации.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать релиз (создаётся тег vX.Y.Z из версии в package.json)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Публикуем по тегу или по ручному запуску с галочкой publish. electron-builder сам создаёт
      # релиз и тег vX.Y.Z из версии в package.json (токен Actions это умеет, в отличие от git-пуша тега).
      PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && 'always' || 'never' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Версия релиза = версия «Радио» из package.json (тег vX.Y.Z)
      - name: Release tag
        id: rel
        run: echo "tag=v$(node -p "require('./radio-air-PC/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # Убираем возможный застрявший релиз/тег этой версии — иначе новый черновик не собрать
      - name: Clean previous release
        if: env.PUBLISH == 'always'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.rel.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          # Пустой застрявший релиз без файлов (если остался от прошлой неудачной публикации)
          gh release delete v0.2.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      # ───────── «Радио» (полное приложение: станция + рация) ─────────
      - name: Install deps (Радио)
        working-directory: radio-air-PC/desktop
        run: npm ci --no-audit --no-fund

      - name: Build Радио
        working-directory: radio-air-PC/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish "$PUBLISH"

      # ───────── «Рация» (отдельное приложение, только виджет) ─────────
      - name: Stage Рация sources
        working-directory: radio-air-PC
        run: python pack_walkie.py

      - name: Install deps (Рация)
        working-directory: radio-air-PC/release/radio-walkie
        run: npm ci --no-audit --no-fund

      - name: Build Рация
        working-directory: radio-air-PC/release/radio-walkie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish "$PUBLISH"

      # Черновик с обоими установщиками и манифестами собран — публикуем его
      - name: Publish release
        if: env.PUBLISH == 'always'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.rel.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # ───────── Артефакты (для ручного запуска без публикации) ─────────
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pc-installers
          path: |
            radio-air-PC/desktop/dist/*.exe
            radio-air-PC/release/radio-walkie/dist/*.exe
          if-no-files-found: warn
