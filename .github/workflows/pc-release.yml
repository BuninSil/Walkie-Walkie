name: PC apps (Радио + Рация)

# Собирает установщики «Радио» (станция + рация) и «Рация» (отдельный виджет) для Windows
# из radio-air-PC. По тегу vX.Y.Z или ручному запуску с галочкой publish — публикует их в один
# релиз GitHub, откуда обновляется electron-updater: «Радио» по latest.yml, «Рация» по walkie.yml.
#
# Файлы (оба .exe, их .blockmap и манифесты latest.yml/walkie.yml) electron-builder кладёт в dist,
# а заливаем их одним gh-релизом (сначала черновик — он изменяемый, потом публикуем): так надёжнее,
# чем две отдельные публикации electron-builder в один релиз (теряются файлы из-за immutable releases).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать релиз (создаётся тег vX.Y.Z из версии в package.json)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && 'yes' || 'no' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Release tag
        id: rel
        run: echo "tag=v$(node -p "require('./radio-air-PC/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # ───────── Сборка (без публикации; electron-builder всё равно пишет latest.yml/walkie.yml) ─────────
      - name: Install deps (Радио)
        working-directory: radio-air-PC/desktop
        run: npm ci --no-audit --no-fund

      - name: Build Радио
        working-directory: radio-air-PC/desktop
        run: npx electron-builder --win --publish never

      - name: Stage Рация sources
        working-directory: radio-air-PC
        run: python pack_walkie.py

      - name: Install deps (Рация)
        working-directory: radio-air-PC/release/radio-walkie
        run: npm ci --no-audit --no-fund

      - name: Build Рация
        working-directory: radio-air-PC/release/radio-walkie
        run: npx electron-builder --win --publish never

      # ───────── Сбор файлов релиза ─────────
      - name: Collect files
        id: collect
        run: |
          mkdir -p out
          cp radio-air-PC/desktop/dist/*.exe radio-air-PC/desktop/dist/*.exe.blockmap radio-air-PC/desktop/dist/latest.yml out/ 2>/dev/null || true
          cp radio-air-PC/release/radio-walkie/dist/*.exe radio-air-PC/release/radio-walkie/dist/*.exe.blockmap radio-air-PC/release/radio-walkie/dist/walkie.yml out/ 2>/dev/null || true
          echo "── файлы релиза ──"; ls -la out

      # ───────── Публикация одним релизом (черновик → опубликовать) ─────────
      - name: Publish release
        if: env.PUBLISH == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          # Убираем битые релизы прошлых попыток (пустой v0.2.0 и неполный v0.2.1)
          for old in v0.2.0 v0.2.1; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Радио и Рация ${tag#v}" \
            --notes "Установщики для Windows. «Радио» — станция + рация, «Рация» — отдельный виджет. Обновляются сами из этого репозитория." \
            --draft out/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # ───────── Артефакты (для ручного запуска без публикации) ─────────
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pc-installers
          path: out/*.exe
          if-no-files-found: warn
